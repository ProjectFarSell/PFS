  title: FarSell Mobile API
  version: 1.0.0-draft
  description: >-
    Proposed contract for review. The routes under this contract are not implemented unless explicitly
    identified as existing. New mobile monetary amounts use integer PHP centavos and UTC ISO 8601 timestamps.
    The database stores product, order, fulfillment and rider earnings values as decimal pesos, while
    settlement fields use integer centavos. Convert decimal values exactly at the API boundary without binary
    floating-point rounding. The existing /catalog response remains backward compatible.


    Sanctum personal access tokens have a fixed 30-day expiry and buyer:* or rider:* ability. A new login and
    applicable web security challenges are required after expiry; no refresh token is issued. Revoke on
    logout, password reset, security changes, account suspension or administrative revocation. A rider must be
    approved and own the assignment; buyers may access only their own records. Seller and admin APIs are out
    of scope.


    All new JSON responses use a data envelope. Errors use code, message and errors. Pagination is cursor
    based for new list endpoints. Authentication and verification routes use a proposed 5 requests/minute per
    IP and account where available; reads 60/minute per token or IP; mutations 30/minute per token; sensitive
    sends and upload mutations 5/minute per token. Return 429 with Retry-After. Tune limits during
    implementation without weakening web security. Idempotency keys are scoped to authenticated user,
    operation and payload. Same key and same payload replays the original status and result; a different
    payload returns 409. Persist atomically with the business transaction and retain at least 24 hours.


    Production checkout supports COD. gateway_stub may be enabled in staging only and never charges money.
    Confirmed delivery does not confirm COD remittance. Web password and verification policies are
    authoritative. Mobile location batching is included at the latest request, subject to explicit approval
    because the approved v1 scope excludes live location and background GPS. Review privacy, retention and
    intended consumers before enabling it.
