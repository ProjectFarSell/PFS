openapi: 3.0.3
info:
  title: 'FarSell Buyer and Rider Mobile API'
  version: 1.0.0-dev.3
  description: 'FarSell Buyer/Rider mobile API. Implementation authorized by the user on 2026-11-13. New operations reuse web business services. Existing /health and /catalog retain their compatibility formats. New operations use UUID public IDs, integer centavos and UTC timestamps. Provider deployment/device verification is tracked separately in backend-runbook.md. Additive Buyer extension includes Google authentication, chat, feedback, cancellation, returns and inbox; main app only. External provider/release acceptance remains pending.'
servers:
  -
    url: 'http://127.0.0.1:8000/api/v1'
    description: 'Laravel development on this computer; all documented operations are implemented.'
  -
    url: 'http://10.0.2.2:8000/api/v1'
    description: 'Standard Android emulator host alias for development only. Real devices need reachable LAN URL. Production/staging must use configured HTTPS; neither exists yet.'
tags:
  -
    name: Existing
  -
    name: Identity
  -
    name: Push
  -
    name: 'Buyer catalogue'
  -
    name: 'Buyer cart'
  -
    name: 'Buyer addresses'
  -
    name: Locations
  -
    name: 'Buyer checkout'
  -
    name: 'Buyer orders'
  -
    name: 'Rider status'
  -
    name: 'Rider offers'
  -
    name: 'Rider shipments'
  -
    name: 'Rider earnings'
  -
    name: Realtime
x-contract-status: 'Implementation authorized by user; frontend handoff review and live release sign-off remain pending.'
x-production-safety:
  payments: 'COD only; gateway_stub permitted ONLY when environment=staging AND explicit staging flag=true. Production deny regardless of flag. No actual card/e-wallet charge.'
  rider_location: 'No location endpoints, polling or broadcasts in v1.'
  secrets: 'No PINs, passwords, bearer/challenge/FCM tokens or delivery personal data in logs, push or broadcast payloads. Authenticated JSON and photos private,no-store.'
x-decisions-file: decisions.md
paths:
  /health:
    get:
      operationId: health
      summary: 'Existing API health response'
      tags:
        - Existing
      security: {}
      description: 'Existing public response is preserved. Health is not a readiness or provider-availability guarantee.'
      x-implementation-status: implemented
      x-review-status: 'existing compatibility operation'
      x-required-ability: none
      x-reuse: routes/api.php
      x-effort: S
      x-risk: Low
      x-idempotency-key: false
      x-pagination: none
      responses:
        200:
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'New authenticated responses: private, no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                name: 'Demo item'
                status: ok
                api_version: v1
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Validation'
        429:
          $ref: '#/components/responses/Throttled'
        503:
          $ref: '#/components/responses/Unavailable'
        500:
          $ref: '#/components/responses/InternalError'
  /catalog:
    get:
      operationId: legacyCatalog
      summary: 'Existing catalogue (compatibility endpoint)'
      tags:
        - Existing
      security: {}
      description: 'EXISTING LEGACY EXCEPTION: numeric database IDs, peso floats and Laravel page pagination remain unchanged. New Flutter screens use /products; never combine legacy IDs/amounts with new endpoints. Existing default validation error shape also remains compatible; common error-envelope policy applies to NEW operations. Document current errors separately in audit.'
      x-implementation-status: implemented
      x-review-status: 'existing compatibility operation'
      x-required-ability: none
      x-reuse: 'CatalogController::index'
      x-effort: S
      x-risk: Low
      x-idempotency-key: false
      x-pagination: 'legacy page-number, 20 items'
      responses:
        200:
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'New authenticated responses: private, no-store.'
          content:
            application/json:
