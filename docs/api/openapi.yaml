            slug:
              type: string
          additionalProperties: false
          required:
            - id
            - name
            - slug
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - description
        - sku
        - unit_price
        - stock
        - has_variants
        - image_url
        - shop
        - category
        - variants
    ProductPage:
      type: object
