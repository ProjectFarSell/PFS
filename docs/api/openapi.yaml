  /auth/challenges/send:
    post:
      operationId: sendLoginChallenge
      summary: 'Send code to saved account destination'
      tags:
        - Identity
      security: {}
      description: 'Primary-login ticket required in body. Not a bearer token. Issue email code through SMTP or prepare fresh Firebase phone challenge. Ten-minute lifetime, five attempts, account-wide 60-second resend cooldown, IP/account/ticket throttles. Expired ticket gives 401; never return raw email code.'
      x-implementation-status: implemented
      x-review-status: 'implemented; automated verification in progress'
      x-required-ability: none
      x-reuse: 'SignInOtp::issue; refactor request-session context into reusable challenge context'
