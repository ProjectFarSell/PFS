              channel: email
  /auth/challenges/verify:
    post:
      operationId: verifyLoginChallenge
      summary: 'Complete login challenge and issue token'
      tags:
        - Identity
      security: {}
      description: 'Email requires code; phone requires fresh id_token. Atomic one-use ticket and proof consumption. Check current role, contact, suspension and security_version again before minting scoped token; proof from an earlier login cannot be reused. Invalid proof 422; expired/reused ticket 401.'
      x-implementation-status: implemented
      x-review-status: 'implemented; automated verification in progress'
