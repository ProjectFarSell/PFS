            - recorded_at
            - photo_available
      required:
        - shipment
        - proof
    FailedAttempt:
      type: object
      additionalProperties: false
      properties:
        failure_reason:
          type: string
          enum:
            - unreachable
            - refused
            - buyer_wrong_variant
            - seller_wrong_item
            - address_issue
            - other
        contact_method:
          type: string
          enum:
            - phone
            - chat
            - doorstep
        exception_note:
          type: string
          minLength: 10
          maxLength: 1000
      required:
        - failure_reason
        - contact_method
        - exception_note
    FailedResult:
      type: object
      additionalProperties: false
      properties:
        shipment:
          $ref: "#/components/schemas/RiderShipment"
        attempt_id:
          type: string
          description: Opaque identifier.
        recorded_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
      required:
        - shipment
        - attempt_id
        - recorded_at
    Earning:
      type: object
      additionalProperties: false
      properties:
        shipment_id:
          type: string
          description: Opaque identifier.
        order_number:
          type: string
          nullable: true
        amount_cents:
          type: integer
          minimum: 0
          description: Integer centavos in PHP.
        earned_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
      required:
        - shipment_id
        - amount_cents
        - earned_at
    LocationPoint:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        recorded_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
        accuracy_m:
          type: number
          minimum: 0
      required:
        - latitude
        - longitude
        - recorded_at
    LocationBatch:
      type: object
      additionalProperties: false
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationPoint"
          minItems: 1
          maxItems: 100
      required:
        - locations
    LocationResult:
      type: object
      additionalProperties: false
      properties:
        accepted_count:
          type: integer
          minimum: 0
        received_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
      required:
        - accepted_count
        - received_at
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds before retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
