components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Sanctum personal access token'
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 160
      example: prod_9fa874cab8124a5e8fc60fdd447ae011
      description: 'Opaque stable UUID public alias. Never parse, guess or replace with a database sequence number. UUID columns are additive; existing numeric web keys remain internal.'
    UtcTime:
      type: string
      format: date-time
      pattern: Z$
      example: '2026-11-13T04:30:00Z'
      description: 'UTC RFC 3339 / ISO 8601 time ending in Z.'
    Money:
      type: integer
      format: int64
      minimum: 0
      example: 54900
      description: 'Philippine centavos; 54900 means PHP 549.00. Never float pesos on new operations.'
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          example: quote_stale
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
      required:
        - message
        - code
    Role:
      type: string
      enum:
        - buyer
        - rider
    ShipmentStatus:
      type: string
      enum:
        - pending
        - accepted
        - ready
        - assigned
        - in_transit
        - delivered
        - completed
        - rejected
        - cancelled
        - delivery_failed
        - returning
        - returned
    OrderStatus:
      type: string
      enum:
        - pending_payment
        - paid
        - confirmed
        - completed
        - packed
        - assigned
        - in_transit
        - delivered
        - cancelled
        - delivery_issue
        - returned
    Session:
      type: object
      properties:
        bio:
          type: string
          nullable: true
          maxLength: 280
        gender:
          type: string
          nullable: true
          enum: [male, female, non_binary, prefer_not_to_say]
        birthday:
          type: string
          format: date
          nullable: true
        has_avatar:
          type: boolean
        avatar_version:
          type: string
          nullable: true
        google_linked:
          type: boolean
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        privacy_notice_version:
          type: string
          nullable: true
        rider_approval:
          type: string
          enum:
            - missing
            - pending
            - approved
            - rejected
            - suspended
          nullable: true
        token_expires_at:
          $ref: '#/components/schemas/UtcTime'
      additionalProperties: false
      required:
        - id
        - name
        - email
        - phone
        - role
        - email_verified
        - phone_verified
        - privacy_notice_version
        - rider_approval
        - token_expires_at
    Token:
      type: object
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
          writeOnly: false
          description: 'Returned once after all required checks; store in OS secure storage, never logs.'
        expires_at:
          $ref: '#/components/schemas/UtcTime'
        abilities:
          type: array
          items:
            type: string
            enum:
              - 'buyer:*'
              - 'rider:*'
        user:
          $ref: '#/components/schemas/Session'
      additionalProperties: false
      required:
        - token_type
        - access_token
        - expires_at
        - abilities
        - user
    Challenge:
      type: object
      properties:
        challenge_token:
          type: string
          description: 'Opaque random one-use ticket bound to user, requested app, identity/security version and 10-minute expiry. Not an access token.'
        expires_at:
          $ref: '#/components/schemas/UtcTime'
        methods:
          type: array
          items:
            type: string
            enum:
              - email
              - phone
        email_hint:
          type: string
          nullable: true
        phone_hint:
          type: string
          nullable: true
        requires_send:
          type: boolean
          enum:
            - true
      additionalProperties: false
      required:
        - challenge_token
        - expires_at
        - methods
        - email_hint
        - phone_hint
        - requires_send
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          format: password
          maxLength: 1024
        app:
          $ref: '#/components/schemas/Role'
      additionalProperties: false
      required:
        - email
        - password
        - app
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          description: 'Mobile registration requires at least 12 characters, mixed case, numbers and symbols. Existing web credentials remain usable; website registration behavior is unchanged.'
        password_confirmation:
          type: string
          format: password
          maxLength: 1024
        privacy_consent:
          type: boolean
          enum:
            - true
        privacy_notice_version:
          type: string
          example: '2026-11-03'
          description: 'Must match current served notice version.'
      additionalProperties: false
      required:
        - name
        - email
        - password
        - password_confirmation
        - privacy_consent
        - privacy_notice_version
    ChallengeSend:
      type: object
      properties:
        challenge_token:
          type: string
          maxLength: 512
        channel:
          type: string
          enum:
            - email
            - phone
      additionalProperties: false
      required:
        - challenge_token
        - channel
    ChallengeProof:
      type: object
      properties:
        challenge_token:
          type: string
          maxLength: 512
        channel:
          type: string
          enum:
            - email
            - phone
        code:
          type: string
          pattern: '^[0-9]{6}$'
        id_token:
          type: string
          maxLength: 10000
          description: 'Fresh Firebase Phone Auth ID token when channel=phone; code required for email; mutual exclusion enforced.'
      additionalProperties: false
      required:
        - challenge_token
        - channel
      oneOf:
        -
          properties:
            channel:
              enum:
                - email
          required:
            - code
          not:
            required:
              - id_token
        -
          properties:
            channel:
              enum:
                - phone
          required:
            - id_token
          not:
            required:
              - code
    ChallengeSent:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        expires_at:
          $ref: '#/components/schemas/UtcTime'
        resend_after:
          $ref: '#/components/schemas/UtcTime'
        phone:
          type: string
          nullable: true
          description: 'Saved normalized phone only for the ticket owner after primary authentication, for Firebase SMS; never accept a supplied alternate destination.'
      additionalProperties: false
      required:
        - channel
        - expires_at
        - resend_after
        - phone
    ContactSend:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
      additionalProperties: false
      required:
        - channel
    ContactProof:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        code:
          type: string
          pattern: '^[0-9]{6}$'
        id_token:
          type: string
          maxLength: 10000
      additionalProperties: false
      required:
        - channel
      oneOf:
        -
          properties:
            channel:
              enum:
                - email
          required:
            - code
          not:
            required:
              - id_token
        -
          properties:
            channel:
              enum:
                - phone
          required:
            - id_token
          not:
            required:
              - code
    RecentAuth:
      type: object
      properties:
        reauth_token:
          type: string
          description: 'Opaque scoped short-lived ticket, cannot be used as an API bearer token.'
        expires_at:
          $ref: '#/components/schemas/UtcTime'
      additionalProperties: false
      required:
        - reauth_token
        - expires_at
    ReauthInput:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
        id_token:
          type: string
          maxLength: 16384
      additionalProperties: false
      oneOf:
        - required: [password]
        - required: [id_token]
    DeletionInput:
      type: object
      properties:
        confirmation:
          type: string
          enum:
            - DELETE
        reauth_token:
          type: string
          maxLength: 512
      additionalProperties: false
      required:
        - confirmation
        - reauth_token
    Deletion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum:
            - pending
        message:
          type: string
          example: 'Request submitted for review. Your account has not been deleted.'
      additionalProperties: false
      required:
        - id
        - status
        - message
    DeviceInput:
      type: object
      properties:
        installation_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
            - android
            - ios
        app:
          $ref: '#/components/schemas/Role'
        fcm_token:
          type: string
          minLength: 1
          maxLength: 4096
        enabled_events:
          type: array
          items:
            type: string
            enum:
              - order.placed
              - order.status_changed
              - shipment.status_changed
              - offer.created
              - offer.expired
              - offer.taken
              - shipment.assigned
              - shipment.cancelled
              - chat.message_created
          uniqueItems: true
      additionalProperties: false
      required:
        - installation_id
        - platform
        - app
        - fcm_token
        - enabled_events
    Device:
      type: object
      properties:
        installation_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
            - android
            - ios
        app:
          $ref: '#/components/schemas/Role'
        enabled_events:
          type: array
          items:
            type: string
        updated_at:
          $ref: '#/components/schemas/UtcTime'
      additionalProperties: false
      required:
        - installation_id
        - platform
        - app
        - enabled_events
        - updated_at
    Variant:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        sku:
          type: string
          minLength: 8
          maxLength: 12
        options:
          type: object
          additionalProperties:
            type: string
          example:
            Size: S
            Color: Black
        unit_price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
        - id
        - sku
        - options
        - unit_price
        - stock
    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sku:
          type: string
          nullable: true
        unit_price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
        has_variants:
          type: boolean
        image_url:
          type: string
          nullable: true
        shop:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/OpaqueId'
            name:
              type: string
            slug:
              type: string
          additionalProperties: false
          required:
