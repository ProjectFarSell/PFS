    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Client UUID. Scoped by authenticated user, operation and resource. Store canonical payload hash (including upload bytes hash), status and safe response atomically with the mutation. Same key/body replays first successful result; different body gives 409 idempotency_conflict. Serialize concurrent requests. Authenticate/authorize before replay. Retain minimum 7 days (proposed); a consumed checkout quote and domain state/unique constraints still prevent duplicates afterwards.'
