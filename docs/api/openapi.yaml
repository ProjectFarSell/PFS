components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - code
        - message
        - errors
    Message:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
        - message
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque identifier.
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - buyer
            - rider
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        verification_channel:
          type: string
          enum:
            - email
            - phone
          nullable: true
        deletion_request_status:
          type: string
          nullable: true
      required:
        - id
        - name
        - email
        - role
        - email_verified
        - phone_verified
    TokenSession:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
        account:
          $ref: "#/components/schemas/Account"
      required:
        - token
        - token_type
        - expires_at
        - account
    AuthChallenge:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          description: Opaque identifier.
        methods:
          type: array
          items:
            type: string
            enum:
              - email_otp
              - phone_otp
              - totp
        expires_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC timestamp in ISO 8601 format.
      required:
        - challenge_id
        - methods
        - expires_at
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          format: password
          maxLength: 1024
        app:
          type: string
          enum:
            - buyer
            - rider
        device_name:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - email
        - password
        - app
        - device_name
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          format: password
          maxLength: 1024
        password_confirmation:
          type: string
          format: password
          maxLength: 1024
        privacy_consent:
          type: boolean
          enum:
            - true
        privacy_notice_version:
          type: string
        device_name:
          type: string
          maxLength: 255
      required:
        - name
        - email
        - password
        - password_confirmation
        - privacy_consent
        - privacy_notice_version
        - device_name
    ChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
            - email_otp
            - phone_otp
