                prev_page_url: null
                to: null
                total: 54900
        404:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
        409:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
        422:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
        429:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
        503:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
        500:
          description: 'Existing Laravel error response; compatibility exception. New Error schema is not guaranteed here. See audit-report.md.'
      parameters:
        -
          in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
        -
          in: query
          name: category_id
          required: false
          schema:
            type: integer
            minimum: 1
        -
          in: query
          name: shop_id
          required: false
          schema:
            type: integer
            minimum: 1
        -
          in: query
          name: city_id
          required: false
          schema:
            type: integer
            minimum: 1
        -
          in: query
          name: price_min
          required: false
          schema:
            type: number
            minimum: 0
        -
          in: query
          name: price_max
          required: false
          schema:
            type: number
            minimum: 0
        -
          in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
        -
          in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
  /auth/login:
    post:
      operationId: login
      summary: 'Password sign-in for buyer or rider app'
      tags:
        - Identity
      security: {}
      description: 'Only buyer/rider app roles. Never issue a usable access token before the required email/phone challenge. Demo exemption uses DemoAccount::exempt only in local/testing. Invalid credentials return 401; valid credentials with incompatible app or suspension return 403. Unapproved riders may receive identity/status-only token; all rider operational routes reject them. Proposed status-only exception needs approval. Mobile Google authentication uses the separate /auth/google operation; website Google login is unchanged.'
      x-implementation-status: implemented
      x-review-status: 'implemented; automated verification in progress'
      x-required-ability: none
      x-reuse: 'Extract primary checks from Auth/LoginController; reuse AccountSecurity and SignInOtp'
      x-effort: M
      x-risk: High
      x-idempotency-key: false
      x-pagination: none
      responses:
        200:
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'New authenticated responses: private, no-store.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Token'
                additionalProperties: false
                required:
                  - data
              example:
                data:
                  token_type: Bearer
                  access_token: 1|example-only-not-a-valid-token
                  expires_at: '2026-11-13T04:30:00Z'
                  abilities:
                    - 'buyer:*'
                  user:
                    id: prod_9fa874cab8124a5e8fc60fdd447ae011
                    name: 'Demo item'
                    email: buyer@farsell.test
                    phone: null
                    role: buyer
                    email_verified: true
                    phone_verified: true
                    privacy_notice_version: null
                    rider_approval: null
                    token_expires_at: '2026-11-13T04:30:00Z'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Validation'
        429:
          $ref: '#/components/responses/Throttled'
        503:
          $ref: '#/components/responses/Unavailable'
        500:
          $ref: '#/components/responses/InternalError'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        202:
          description: 'Additional sign-in challenge required'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'New authenticated responses: private, no-store.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Challenge'
                additionalProperties: false
                required:
                  - data
              example:
                data:
                  challenge_token: example-only-not-a-valid-ticket
                  expires_at: '2026-11-13T04:30:00Z'
                  methods:
                    - email
                  email_hint: null
                  phone_hint: null
                  requires_send: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: buyer@farsell.test
              password: ExampleOnly!2026
              app: buyer
