# Only content-hashed build output is immutable. Never apply this to HTML or uploads.
<Directory /var/www/html/public/build/assets>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>
<Directory /var/www/html/public>
    Options -Indexes
</Directory>
